# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/lawapp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Settings - Üretimde JWT_SECRET ortam değişkeni MUTLAKA tanımlanmalıdır
lawapp.jwt.secret=${JWT_SECRET:defaultDevKeyOnlyForLocalTesting123456789012345}
lawapp.jwt.expirationMs=86400000
