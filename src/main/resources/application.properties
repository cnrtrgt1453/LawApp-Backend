# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/lawapp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Settings - Üretimde JWT_SECRET ortam değişkeni MUTLAKA tanımlanmalıdır
lawapp.jwt.secret=${JWT_SECRET:defaultDevKeyOnlyForLocalTesting123456789012345}
lawapp.jwt.expirationMs=86400000
